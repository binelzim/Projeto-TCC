# ==========================================
# 1. CONEXÃO COM O BANCO DE DADOS POSTGRESQL
# ==========================================
# O endereço onde o banco está rodando e o nome do banco (transporte_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/transporte_db
spring.datasource.username=postgres
spring.datasource.password=root

# ==========================================
# 2. CONFIGURAÇÕES DO HIBERNATE / JPA
# ==========================================
# O comando "update" é mágico: ele lê nossas classes Java (Entidades) e cria as tabelas no banco automaticamente!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 3. LOGS (EXCELENTE PARA DEBUGAR)
# ==========================================
# Mostra no terminal os comandos SQL que o Spring está executando por trás dos panos
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true