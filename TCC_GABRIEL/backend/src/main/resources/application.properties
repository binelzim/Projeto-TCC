server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:transporte;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.time-zone=America/Sao_Paulo
app.checkin.cooldown-seconds=${CHECKIN_COOLDOWN_SECONDS:10}
app.demo.enabled=${DEMO_ENABLED:true}
app.driver.password=${DRIVER_PASSWORD:motorista123}
app.session.hours=12
app.gps.ttl-seconds=30

