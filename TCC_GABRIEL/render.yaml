services:
  - type: web
    name: rota-universitaria-api
    runtime: docker
    plan: free
    branch: main
    rootDir: TCC_GABRIEL/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_ENABLED
        value: "true"
      - key: CHECKIN_COOLDOWN_SECONDS
        value: "10"

